<style>
:root{color-scheme:dark;--bg:#0c1427;--panel:#152139;--ink:#f4f7ff;--muted:#b8c6dd;--mint:#8df0c9;--line:#354660;--gold:#ffe09b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,sans-serif}button,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px 18px;background:#20314d;color:var(--ink);font-weight:650}button:hover{background:#2d4569}button:disabled{cursor:default;opacity:.8}button.primary{background:var(--mint);color:#082d26;border-color:var(--mint)}:focus-visible{outline:3px solid var(--gold);outline-offset:4px}a{color:var(--mint)}header{border-bottom:1px solid var(--line)}.nav{max-width:1120px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-size:23px;font-weight:850;letter-spacing:-1px}.brand span{color:var(--mint)}.nav-actions,.actions{display:flex;gap:12px;flex-wrap:wrap}main{max-width:1120px;margin:auto;padding:36px 24px 70px}.eyebrow{color:var(--mint);font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(36px,6vw,66px);line-height:1.08;letter-spacing:-2px;margin:16px 0 22px}h2{font-size:28px;line-height:1.25}h3{line-height:1.35}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:32px;align-items:center;margin-bottom:34px}.panel,.card{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:26px}.console{background:linear-gradient(130deg,#183d41,#192747);border:1px solid #4b7d78}.console .pixel{font-family:monospace;color:var(--mint);font-size:64px;line-height:1.2}.stats{display:flex;gap:30px;flex-wrap:wrap}.stat strong{display:block;font-size:28px;color:var(--mint)}.levels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 30px}.levels button{text-align:left;padding:20px}.levels button[aria-pressed=true]{border:2px solid var(--mint);background:#1a3b3e}.levels span{display:block;font-weight:400;color:var(--muted);font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{display:flex;flex-direction:column;align-items:flex-start}.card p{flex:1}.number{color:var(--mint);font:800 15px monospace}.badge{font-size:13px;color:var(--gold)}.card h3{font-size:23px;margin:12px 0 0}.card button{width:100%}.topline{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.quiz{max-width:800px;margin:0 auto}.question{font-size:26px;line-height:1.4}.choices{display:grid;gap:12px}.choices button{text-align:left;font-weight:500}.choices button.correct{border:2px solid var(--mint);background:#173e36}.choices button.wrong{border:2px solid #ffb5b5;background:#4b2738}.feedback{border-left:4px solid var(--mint);background:#1a3340;padding:18px;margin:24px 0}.feedback h3{margin:0 0 8px}.feedback p{margin:0}progress{width:100%;height:12px;accent-color:var(--mint);margin:18px 0}.hidden,[hidden]{display:none!important}.small{font-size:14px}.guide{max-width:850px;margin:auto}.guide section{margin:26px 0}.guide li{margin:10px 0}summary{cursor:pointer;font-weight:700;padding:12px 0}details{border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--muted);font-size:14px}.skip{position:absolute;top:-100px}.skip:focus{top:8px;left:8px;background:var(--bg);padding:12px;z-index:2}.notice{padding:14px 18px;border:1px solid var(--line);border-radius:12px}.report{white-space:pre-wrap} @media(max-width:680px){.hero,.grid,.levels{grid-template-columns:1fr}.console{display:none}main{padding:24px 16px 50px}.panel,.card{padding:20px}.nav{padding:16px}.question{font-size:23px}h1{letter-spacing:-1px}}@media print{body{background:white;color:black;font-size:12pt}.nav,footer,.no-print,button{display:none!important}main{max-width:none;padding:0}.panel,.card{background:white;color:black;border:1px solid #888}.muted,.eyebrow,.number,.badge,a{color:#222}details{break-inside:avoid}h1{font-size:30pt}.guide{max-width:none}}

<body><a class="skip" href="#main">Skip to content</a>
<header><div class="nav"><div class="brand"><span>▦</span> BYTE QUEST</div><div class="nav-actions"><button id="homeBtn">Mission map</button><button id="guideBtn">Teacher guide</button></div></div></header>
<main id="main" tabindex="-1"></main>
<footer>Computer Literacy Lab · Grades 6–12 · No timer. No account. Learn at your own pace.<br>This standalone game sends no data. Progress lasts until you close or reload this page.</footer>
<script>
'use strict';
const topics=[{name:'Computer basics',icon:'01 / SYSTEMS',desc:'Meet the hardware and software that power your digital world.'},{name:'Online safety',icon:'02 / SHIELD',desc:'Spot risky messages, protect accounts, and make safer choices.'},{name:'File management',icon:'03 / ARCHIVE',desc:'Name, organize, find, and protect your work.'},{name:'Troubleshooting',icon:'04 / REPAIR',desc:'Use clues and safe steps to solve everyday tech problems.'}];
// Each question: prompt, choices, correct index, explanation.
const bank={
explorer:[
[
['You are recording a podcast. Which device sends your voice into the computer?',['Speakers','A microphone','A monitor','A printer'],1,'A microphone is an input device: it sends sound into the computer. Speakers send sound out.'],
['Which example is software?',['A keyboard','A processor','A web browser','A USB cable'],2,'Software is a set of instructions or programs. A browser is software; the other items are physical hardware.'],
['Where does a saved file usually remain after the computer is turned off?',['In RAM only','On its storage drive','On the keyboard','In the screen'],1,'Storage keeps saved files when power is off. RAM is temporary working memory. Save changes before shutting down.'],
['What does an operating system do?',['Only searches the web','Only creates presentations','Makes every website safe','Manages hardware, files, and applications'],3,'An operating system manages the device and provides services that applications use. Windows, macOS, and ChromeOS are examples.']
],
[
['A message says you won a prize and asks for your school password. What should you do?',['Reply with the password','Click to see if it looks real','Do not click; report it to a trusted adult or school IT','Forward it to classmates'],2,'Unexpected prizes and requests for passwords are warning signs. Do not share the password or use the message’s links; report through a trusted channel.'],
['Which account habit is safest?',['Use one short password everywhere','Use a unique long passphrase and multifactor authentication when available','Share your password with your best friend','Use your birthday'],1,'Unique long passwords or passphrases reduce the damage from one compromised account. Multifactor authentication adds another check. Follow school account rules.'],
['Before posting a class photo publicly, what should you do?',['Ask permission and check that private information is not visible','Tag everyone’s home address','Post it because you took it','Include the class login code'],0,'Respect other people’s consent and privacy. Check the background for personal details, and follow your school’s photo-sharing rules.'],
['Someone sends you hurtful messages online. What is a good response?',['Send threats back','Keep it secret forever','Share their personal information','Save evidence if safe, block or report, and tell a trusted adult'],3,'You do not need to handle harassment alone. Avoid retaliation, preserve evidence when safe, and get support from a trusted adult.']
],
[
['Which filename will be easiest to recognize later?',['stuff','finalfinal2','Science_WaterCycle_2026-10-20.docx','Untitled'],2,'A descriptive name with a topic and date makes work easier to identify and sort. Use a consistent pattern.'],
['Where would you put your science lab report?',['In a folder named Science inside Schoolwork','In the trash','In any folder at random','Only in the browser history'],0,'Folders group related files. A clear folder structure helps you find and manage your work.'],
['You accidentally deleted a file. What is a sensible first place to check?',['The volume settings','The recycle bin or trash','The keyboard settings','A random website'],1,'Deleted files may remain in the recycle bin or trash until it is emptied. Recovery is not guaranteed; cloud services may also have a deleted-files area.'],
['What is a backup?',['Renaming the original file','Moving your only copy to another folder','Leaving a document open','An additional copy kept in another safe location'],3,'A backup is an extra copy you can recover if the original is lost. A second copy on the same failing device may be lost too.']
],
[
['A video has no sound. What should you check first?',['Erase the computer','Buy new speakers immediately','Volume, mute, and the selected audio output','Uninstall the operating system'],2,'Start with simple checks: player and device volume, mute, headphone connections, and the selected output device.'],
['One app has frozen, but other apps work. What should you try?',['Wait briefly, then close and reopen that app if needed','Delete all your files','Repeatedly hit the keyboard','Share your password with a stranger'],0,'Start with the affected app. Save other work if possible. Force-closing an app can lose unsaved changes, so use it only if the app will not respond.'],
['A laptop will not charge. What is a safe first check?',['Open the power adapter','Check that the undamaged charger is connected securely to a working outlet','Touch exposed wires','Download a battery booster'],1,'Check safe, external connections first. Stop using damaged, hot, or sparking equipment and tell an adult or IT staff.'],
['You need school IT to help with an error. What information helps most?',['Your password','Only “it broke”','A list of classmates','What you tried, the exact error, and when it happens'],3,'Describe the device, app, steps, and error message without sharing passwords or private data. Good evidence helps IT reproduce the problem.']
]
],
navigator:[
[
['Your laptop slows down when many apps are open, but the drive has plenty of free space. Which explanation fits best?',['The display is too bright','Working memory is under pressure','Every file is a virus','The printer is disconnected'],1,'Open apps use RAM. Memory pressure can slow a system even with free storage. Close unnecessary apps and tabs before considering other causes.'],
['Which statement about the web and internet is accurate?',['They are exactly the same thing','The internet exists only inside browsers','The web is one service that uses the internet','Email cannot use the internet'],2,'The internet connects networks. The web uses it to deliver websites; other services, including email, also use the internet.'],
['A photo editor runs on your device, while another runs in a browser. What can you conclude?',['Both are software, but their storage and offline behavior may differ','Browser tools never use the network','Installed apps never need updates','Browser tools automatically back up every file'],0,'Both are software. Check where each tool saves work and whether it supports offline use; do not assume work is backed up.'],
['Why should you install approved operating system updates?',['They guarantee that no attacks can happen','They always increase storage capacity','They replace the need for backups','They can fix security flaws and reliability problems'],3,'Updates often patch vulnerabilities and bugs. Use approved update tools and school IT guidance; updates do not replace backups or safe habits.']
],
[
['An email appears to be from school IT. Its link uses a misspelled school domain and asks you to log in urgently. What is best?',['Trust it because it has the school logo','Use the known school portal or contact IT independently','Reply with your login','Open the link and enter a test password'],1,'Names and logos can be copied. Verify through a known address or trusted contact, not the suspicious message’s link or phone number.'],
['You receive a multifactor approval request when you are not signing in. What should you do?',['Approve it to make it stop','Ask a friend to approve it','Deny it and report it through the official account-support channel','Turn off all security settings'],2,'Unexpected prompts may mean someone is trying to access your account. Deny them, report the activity, and follow official steps to secure the account.'],
['A website uses HTTPS. What does that tell you?',['The connection is encrypted, but the site may still be dishonest','Every claim on the site is true','The owner is your school','Downloads cannot contain harmful software'],0,'HTTPS helps protect data in transit. Scam sites can also use HTTPS, so check the domain, purpose, and trustworthiness.'],
['A quiz app requests contacts and precise location, which it does not need. What should you do?',['Grant everything for convenience','Upload the class contact list','Disable all device protections','Deny unnecessary permissions and ask a teacher about an approved alternative'],3,'Give apps only the permissions they need. School-approved tools and minimal data sharing help protect you and others.']
],
[
['A friend changes photo.jpg to photo.pdf by renaming it. What happened?',['The photo was converted to PDF','Only the name changed; use a proper export or conversion tool','The image was automatically compressed','The file was backed up'],1,'An extension is part of a filename, not a conversion command. Use an application’s export or save-as function to change formats properly.'],
['Your cloud folder syncs deletions across devices. Why keep a separate backup?',['Sync never needs internet','Sync makes files impossible to delete','An accidental deletion can sync too; a backup offers another recovery route','Backups replace all access controls'],2,'Sync keeps locations consistent, including some mistakes. Check version history and retention, and maintain a separate approved backup where appropriate.'],
['You need to share a draft with one partner for comments only. Which setting fits?',['Only that partner, with commenting permission','Anyone with the link, with editing permission','Public editing','Send your own login details'],0,'Use the narrowest audience and permission that meet the task. Comment access lets a partner give feedback without directly rewriting your work.'],
['A shared project contains draft1, final, final2, and final_really. What is the best improvement?',['Delete every older file immediately','Put every file in a different random folder','Remove all extensions','Agree on descriptive names and versions, and use version history if available'],3,'A naming convention and version history help teams identify current work and recover changes. Agree before moving or deleting shared files.']
],
[
['Only one website fails, while several unrelated sites load. What is the next reasonable test?',['Factory-reset the device','Check the address and try the site again or check a trusted service-status page','Replace the router immediately','Delete your school account'],1,'Other sites loading suggests the connection works. Test the affected address or service before changing the whole device or network.'],
['A printer has paper and power, but your job is not printing. What should you inspect next?',['The wallpaper','The webcam','Selected printer, connection, and print queue','Your social-media profile'],2,'The job may have gone to the wrong printer, the printer may be offline, or the queue may be paused. Avoid sending repeated copies while diagnosing.'],
['You are troubleshooting an intermittent error. Why change one setting at a time?',['It helps you tell which change affected the problem','It guarantees the first change works','It removes the need to record results','It makes backups unnecessary'],0,'Reproduce the issue, change one thing, and retest. Record results and reverse changes that did not help when appropriate.'],
['A browser pop-up says your device is infected and gives a support number. What should you do?',['Call and pay immediately','Install the offered remote-access tool','Give the caller your school password','Avoid the pop-up’s links and number; close it and contact trusted IT'],3,'Fake warnings pressure people into paying or granting access. Use trusted support channels. If you already interacted, tell IT what happened promptly.']
]
]};
const levelNames={explorer:'Explorer',navigator:'Navigator'};
let level='explorer';
const state={explorer:topics.map(()=>[]),navigator:topics.map(()=>[])};
let active=null, position=0, screen='home';
const main=document.getElementById('main');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const answers=()=>state[level][active];
const score=(l=level,t=null)=>(t===null?state[l].flat():state[l][t]).reduce((n,a)=>n+(a.correct?100:0),0);
const completed=(l=level)=>state[l].filter(a=>a.length===4).length;
function show(html){main.innerHTML=html;main.focus();window.scrollTo(0,0)}
function home(){screen='home';active=null;const done=completed();show(`<div class="hero"><div><div class="eyebrow">Your next digital adventure</div><h1>Small skills.<br>Big byte energy.</h1><p class="muted">Restore the lab’s four systems. Solve real-world tech challenges, build your confidence, and earn your Byte Quest badge.</p><p class="small">Grades 6–12 · 16 challenges per level · About 15–25 minutes</p></div><div class="panel console"><div class="eyebrow">Lab status / ${levelNames[level]}</div><div class="pixel" aria-hidden="true">[ &gt;_ ]</div><p>Every smart choice powers the lab.</p><div class="stats"><div class="stat"><strong>${score()}</strong>of 1,600 points</div><div class="stat"><strong>${done}/4</strong>missions complete</div></div></div></div><h2>Choose your challenge</h2><p class="muted">Start where you feel comfortable. Both levels are open to all grades; switching keeps each level’s progress in this session.</p><div class="levels">${Object.keys(levelNames).map(l=>`<button data-level="${l}" aria-pressed="${level===l}">${levelNames[l]} <span>${l==='explorer'?'Foundations · Suggested grades 6–8':'Applied scenarios · Suggested grades 9–12'}</span></button>`).join('')}</div><div class="topline"><h2>Your mission map</h2><span class="badge">${score()} / 1,600 points · ${done}/4 complete</span></div><p class="muted">Choose any mission. Each has four questions. A correct first answer earns 100 points; every answer unlocks an explanation. There is no timer.</p><div class="grid">${topics.map((t,i)=>{const a=state[level][i];return `<article class="card"><span class="number">${t.icon}</span><h3>${t.name}</h3><p class="muted">${t.desc}</p><p class="badge">${a.length===4?'✓ Complete':a.length?`${a.length}/4 answered`:'Ready to explore'} · ${score(level,i)}/400</p><button data-mission="${i}" class="${a.length===4?'':'primary'}">${a.length===4?'Review mission':a.length?'Continue mission':'Start mission'} <span aria-hidden="true">→</span></button></article>`}).join('')}</div>${done===4?'<div class="panel" style="margin-top:24px"><h2>Lab restored!</h2><p>You have finished all four missions in this level. See your results and next steps.</p><button class="primary" id="resultsBtn">View results</button></div>':''}<p class="small muted">Progress is stored only in this open page. Download a results report before closing or reloading.</p>`);
main.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;home()});main.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.mission);position=state[level][active].length===4?0:state[level][active].length;quiz()});document.getElementById('resultsBtn')?.addEventListener('click',results)}
function quiz(){screen='quiz';const q=bank[level][active][position],saved=answers()[position];show(`<div class="quiz"><div class="topline"><span class="eyebrow">${levelNames[level]} / ${topics[active].name}</span><span>${score()} points</span></div><progress max="4" value="${position+1}" aria-label="Question ${position+1} of 4"></progress><p class="muted">Question ${position+1} of 4${saved?' · Answer recorded':''}</p><h1 class="question">${q[0]}</h1><div class="choices">${q[1].map((c,i)=>`<button data-choice="${i}" ${saved?'disabled':''} class="${saved?(i===q[2]?'correct':i===saved.choice?'wrong':''):''}"><span aria-hidden="true">${String.fromCharCode(65+i)}. </span>${c}${saved&&i===q[2]?' ✓ Correct answer':''}${saved&&i===saved.choice?' — Your answer':''}</button>`).join('')}</div><div id="feedback" role="status">${saved?feedback(q,saved):''}</div><div class="actions" style="margin-top:24px">${saved?`<button class="primary" id="nextBtn">${position===3?'Mission results':'Next challenge →'}</button>`:''}<button id="mapBtn">Back to mission map</button></div></div>`);main.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));document.getElementById('nextBtn')?.addEventListener('click',next);document.getElementById('mapBtn').onclick=home}
function feedback(q,a){return `<div class="feedback"><h3>${a.correct?'Nice work! +100 points':'Good learning moment · +0 points'}</h3><p>${q[3]}</p></div>`}
function choose(choice){if(answers()[position])return;const q=bank[level][active][position];answers().push({choice,correct:choice===q[2]});quiz();document.getElementById('nextBtn').focus()}
function next(){if(position<3){position++;quiz()}else missionResult()}
function missionResult(){screen='missionResult';show(`<div class="quiz panel"><div class="eyebrow">System restored</div><h1 class="question">${topics[active].name} complete!</h1><h2>${score(level,active)} / 400 points</h2><p>You answered ${score(level,active)/100} of 4 correctly. Review the explanations to strengthen your skills. Reviewing does not change your score.</p><div class="actions"><button class="primary" id="returnBtn">${completed()===4?'View level results':'Choose another mission'}</button><button id="reviewBtn">Review answers</button></div></div>`);document.getElementById('returnBtn').onclick=completed()===4?results:home;document.getElementById('reviewBtn').onclick=()=>{position=0;quiz()}}
function results(){screen='results';const s=score(),badge=s>=1400?'Digital Defender':s>=1000?'Tech Trailblazer':'Byte Builder';show(`<div class="quiz"><div class="eyebrow">${levelNames[level]} / Mission debrief</div><h1>${badge}</h1><p>You restored all four lab systems. Your next mission: put these skills to work beyond the game.</p><div class="panel"><h2>${s} / 1,600 points</h2><p>${s/100} of 16 correct · ${Math.round(s/1600*100)}% accuracy</p><table><caption class="small">Your results by topic</caption><thead><tr><th>Mission</th><th>Points</th></tr></thead><tbody>${topics.map((t,i)=>`<tr><td>${t.name}</td><td>${score(level,i)} / 400</td></tr>`).join('')}</tbody></table><p>${topics.filter((t,i)=>score(level,i)<300).length?'Practice next: '+topics.filter((t,i)=>score(level,i)<300).map(t=>t.name.toLowerCase()).join(', ')+'. Review these missions and explain one safer or more effective choice.':'Strong work across all topics. Explain your reasoning to a partner, then try the other difficulty level.'}</p></div><div class="actions" style="margin-top:24px"><button class="primary" id="downloadBtn">Download results (.txt)</button><button id="otherBtn">Try ${level==='explorer'?'Navigator':'Explorer'}</button><button id="backBtn">Mission map</button><button id="resetBtn">Reset this level</button></div><p class="small muted">The report contains your level and scores, not your name. Resetting clears only this level’s answers after confirmation.</p></div>`);document.getElementById('downloadBtn').onclick=download;document.getElementById('otherBtn').onclick=()=>{level=level==='explorer'?'navigator':'explorer';home()};document.getElementById('backBtn').onclick=home;document.getElementById('resetBtn').onclick=()=>{if(confirm('Clear all answers and points for '+levelNames[level]+'? This cannot be undone. Download your results first if you need them.')){state[level]=topics.map(()=>[]);home()}}}
function download(){const text=`BYTE QUEST — ${levelNames[level]}\n${new Date().toLocaleDateString()}\nScore: ${score()} / 1600\nCorrect: ${score()/100} / 16\n\n`+topics.map((t,i)=>`${t.name}: ${score(level,i)} / 400`).join('\n')+'\n\nReflection: What is one skill you will use this week?\n';const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`Byte-Quest-${levelNames[level]}-Results.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function guide(){screen='guide';show(`<article class="guide"><div class="eyebrow">Educator resources</div><h1>Teacher field guide</h1><p class="muted">A ready-to-use computer literacy activity for grades 6–12. Use independently, in pairs, or as a projected class discussion.</p><div class="actions no-print"><button class="primary" id="printGuide">Print / save guide as PDF</button><button id="playBtn">Return to game</button></div><section class="panel"><h2>At a glance</h2><p><strong>Time:</strong> 25–40 minutes including discussion. <strong>Materials:</strong> this HTML file and a modern browser. No internet connection or additional files are needed after download.</p><p><strong>Levels:</strong> Explorer introduces foundational skills (suggested grades 6–8). Navigator uses applied scenarios (suggested grades 9–12). Choose by readiness, not age alone. Each level includes 16 questions across four missions.</p></section><section><h2>Learning goals</h2><ul><li><strong>Computer basics:</strong> distinguish input/output, hardware/software, and memory/storage; explain how operating systems and online services fit together.</li><li><strong>Online safety:</strong> recognize suspicious requests, protect accounts, respect privacy, and seek trusted help.</li><li><strong>File management:</strong> choose useful names and folders, recover work, understand backup versus sync, and share with suitable permissions.</li><li><strong>Troubleshooting:</strong> start with safe checks, isolate a problem, test one change at a time, and communicate useful evidence.</li></ul></section><section><h2>Suggested lesson sequence</h2><ol><li><strong>Launch · 3–5 minutes:</strong> ask “What tech problem have you solved recently?” Demonstrate selecting a level and opening a mission.</li><li><strong>Play · 15–25 minutes:</strong> students complete four missions, reading each explanation before continuing. In pairs, ask them to justify a choice before submitting.</li><li><strong>Reflect · 5–10 minutes:</strong> students download their results and write one new habit and one question. Review common misconceptions together.</li></ol></section><section><h2>Scoring and assessment</h2><p>A correct first answer earns 100 points. An incorrect answer earns 0, with no extra penalty. Each mission is worth 400 points; each level is worth 1,600. Answers lock on selection. Review adds no points; a confirmed reset allows a fresh attempt.</p><p>Badges: <strong>Digital Defender</strong> for 1,400–1,600; <strong>Tech Trailblazer</strong> for 1,000–1,300; <strong>Byte Builder</strong> for 0–900. Everyone who finishes restores the lab. Treat scores as formative evidence; the answer key is available in this guide, and this is not a secure test.</p><p>For each topic, 300–400 suggests a strong start; 200 suggests discussion and practice; 0–100 suggests guided review. Pair scores with an explanation or practical demonstration rather than assigning a grade from the game alone.</p></section><section><h2>Access, classroom delivery, and privacy</h2><p>Share the HTML file through your school’s approved learning platform or storage. Students should download it and open it in a browser; some platforms show HTML as text or block embedded previews. A teacher or school can also host this same file on an approved static website for link-based play.</p><p>This file makes no network requests, collects no names, and has no teacher dashboard. Answers live only in the current page’s memory. Reloading or closing clears them. Ask students to download their result report before closing; use your approved assignment workflow to collect it.</p><p>All controls support keyboard navigation. Use Tab / Shift+Tab to move and Enter or Space to activate buttons. There is no timer, drag-and-drop, audio requirement, or color-only feedback. Browser zoom and screen readers can be used. Allow read-aloud support, partner reasoning, and extra time as needed.</p></section><section><h2>Discussion and transfer</h2><ul><li>Why is a browser different from the internet? Give an example of hardware and software working together.</li><li>What would make a message suspicious even if it uses your school’s logo?</li><li>Create a sample folder structure and filename for a class project. Explain where its backup would live.</li><li>Describe the first three checks for a device with no sound. What information would you send to IT?</li></ul><p>Use fictional accounts and sample files for follow-up practice. Never ask students to reveal real passwords. Follow school policies for software, account security, and incident reporting.</p></section><section><h2>Answer key and teaching notes</h2><p class="muted">Expand a topic to see each answer and rationale. Printing this guide includes all answers.</p>${Object.keys(levelNames).map(l=>`<h3>${levelNames[l]}</h3>${topics.map((t,i)=>`<details><summary>${t.name}</summary><ol>${bank[l][i].map(q=>`<li><strong>${escapeHTML(q[0])}</strong><br>Answer: ${String.fromCharCode(65+q[2])}. ${escapeHTML(q[1][q[2]])}<br><span class="muted">${escapeHTML(q[3])}</span></li>`).join('')}</ol></details>`).join('')}`).join('')}</section></article>`);document.getElementById('playBtn').onclick=home;document.getElementById('printGuide').onclick=()=>{main.querySelectorAll('details').forEach(d=>d.open=true);window.print()}}
